name: CI - Tests and Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "black>=23.0.0,<24.0.0" "flake8>=6.0.0,<7.0.0" "mypy>=1.5.0,<2.0.0"

      - name: Check code formatting with Black
        run: |
          # Preserve historical formatting in three legacy paper-result helpers;
          # all revised experiment paths remain under the formatting gate.
          black --check \
            --exclude 'src/(utils/verify_results_to_paper|visualization/(plot_normalized_rmse|regenerate_all_paper_figures))\.py' \
            src/ tests/

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports
        continue-on-error: true

  experiments:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # The frozen canonical payload was generated under Python 3.12.
          # Cross-version behavior remains covered by the test matrix above.
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run experiments
        run: |
          python -m src.experiments.run_revised_experiment \
            --config configs/revised_experiment.json \
            --output /tmp/revised_results.json

      - name: Verify canonical scientific payload
        run: |
          python -m src.utils.verify_revised_results \
            --config configs/revised_experiment.json \
            --result /tmp/revised_results.json
          python - <<'PY'
          import json
          from pathlib import Path

          generated = json.loads(Path('/tmp/revised_results.json').read_text())
          canonical = json.loads(
              Path('results/revised_experiment/canonical_results.json').read_text()
          )
          assert generated['scientific_payload_sha256'] == canonical['scientific_payload_sha256']
          assert generated['scientific_payload'] == canonical['scientific_payload']
          print('Canonical scientific payload reproduced exactly.')
          PY
